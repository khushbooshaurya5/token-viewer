[project]
name = "token-viewer"
version = "0.1.0"
description = "Token viewer back end: the controller, the view-models and a FastAPI layer for the page"
requires-python = ">=3.11"
# Yours: the libraries your code needs, such as your model's. Add each with
# uv add in the backend folder, which updates uv.lock too.
dependencies = [
    "fastapi>=0.159.1,<0.160",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54.0,<0.55",
]
# Yours: a [project.scripts] table with the command that starts your terminal
# view, as in token_lab/pyproject.toml in the course repository.

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # FastAPI's TestClient runs on httpx2. With the older httpx it warns, and
    # mypy cannot check the tests' requests and responses.
    "httpx2>=2.15.1,<3",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88
# Code blocks in Markdown files are excerpts. Check only Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 layout
    "F",       # Pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "N",       # pep8-naming
    "D",       # pydocstyle: docstrings
    "UP",      # pyupgrade: modern syntax for the supported Python versions
    "ANN",     # flake8-annotations: type hints on every function
    "B",       # flake8-bugbear: likely bugs
    "S",       # flake8-bandit: security, e.g. HTTP requests without a timeout
    "SIM",     # flake8-simplify
    "PTH",     # prefer pathlib over os.path
    "RUF",     # Ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements and need no docstrings for each test.
"tests/*" = ["S101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
